<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MproAll | Workspace</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💻</text></svg>">
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-glass: rgba(255, 255, 255, 0.03);
            --card-glass: rgba(255, 255, 255, 0.04);
            --card-hover: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f7;
            --text-sub: rgba(255, 255, 255, 0.5);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent: #0a84ff;
        }

        [data-theme="light"] {
            --bg-color: #f2f2f7;
            --surface-glass: rgba(255, 255, 255, 0.7);
            --card-glass: rgba(255, 255, 255, 0.6);
            --card-hover: rgba(255, 255, 255, 0.9);
            --text-main: #1d1d1f;
            --text-sub: rgba(60, 60, 67, 0.6);
            --border-glass: rgba(0, 0, 0, 0.06);
            --accent: #007aff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            user-select: none;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
            background-size: cover;
            background-position: center;
        }

        /* Apple Glass Title Bar */
        .titlebar {
            height: 38px;
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            border-bottom: 1px solid var(--border-glass);
            z-index: 10;
        }

        .titlebar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .app-logo-text {
            font-weight: 600;
            font-size: 13px;
            letter-spacing: -0.01em;
            color: var(--text-main);
        }

        .menu-bar {
            display: flex;
            gap: 4px;
        }

        .menu-item {
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 6px;
            color: var(--text-sub);
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s, color 0.15s;
        }

        .menu-item:hover {
            background: var(--card-hover);
            color: var(--text-main);
        }

        .titlebar-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-toggle-btn {
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            cursor: pointer;
            padding: 4px 10px;
            font-size: 12px;
            border-radius: 6px;
            backdrop-filter: blur(10px);
            transition: all 0.2s;
        }

        .theme-toggle-btn:hover {
            background: var(--card-hover);
        }

        /* Glass Ribbon Toolbar */
        .ribbon-bar {
            background: var(--surface-glass);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border-glass);
            padding: 8px 16px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .ribbon-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 5px 12px;
            font-size: 12px;
            font-weight: 400;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .ribbon-btn:hover {
            background: var(--card-hover);
            transform: translateY(-1px);
        }

        /* Main Glass Workspace */
        .workspace {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
        }

        .section-header {
            margin-bottom: 24px;
        }

        .section-header h2 {
            font-size: 21px;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: var(--text-main);
            margin-bottom: 4px;
        }

        .section-header p {
            font-size: 13px;
            color: var(--text-sub);
        }

        /* Liquid Glass App Grid Cards */
        .apps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }

        .app-card {
            background: var(--card-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 22px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .app-card:hover {
            background: var(--card-hover);
            transform: translateY(-4px);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 16px 36px rgba(0, 0, 0, 0.2);
        }

        .app-icon-svg {
            width: 46px;
            height: 46px;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15));
        }

        .app-name {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-main);
            letter-spacing: -0.01em;
        }
    </style>
</head>
<body>

    <div class="titlebar">
        <div class="titlebar-left">
            <span class="app-logo-text">mproAll</span>
            <div class="menu-bar">
                <span class="menu-item">File</span>
                <span class="menu-item">Tools</span>
                <span class="menu-item">Apps</span>
                <a href="settings.html" class="menu-item">Settings</a>
            </div>
        </div>

        <div class="titlebar-controls">
            <button class="theme-toggle-btn" id="themeToggleBtn" onclick="toggleTheme()" title="Toggle Theme">🌙</button>
        </div>
    </div>

    <div class="ribbon-bar">
        <button class="ribbon-btn" onclick="location.reload()">🔄 Refresh Workspace</button>
        <a href="settings.html" class="ribbon-btn">⚙️ System Settings</a>
    </div>

    <div class="workspace">
        <div class="section-header">
            <h2 id="welcomeTitle">Your Favorite Apps Right Where You Need Them</h2>
            <p id="welcomeSubtitle">Mpro inc</p>
        </div>

        <!-- Modular App Grid -->
        <div class="apps-grid" id="appsGrid"></div>
    </div>

    <script>
        // Load Settings from LocalStorage
        function loadSettings() {
            const savedTheme = localStorage.getItem('mpro_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', savedTheme);
            document.getElementById('themeToggleBtn').innerText = savedTheme === 'light' ? '☀️' : '🌙';

            const savedTitle = localStorage.getItem('mpro_welcome_title');
            if (savedTitle) document.getElementById('welcomeTitle').innerText = savedTitle;

            const savedSub = localStorage.getItem('mpro_welcome_sub');
            if (savedSub) document.getElementById('welcomeSubtitle').innerText = savedSub;

            const savedBg = localStorage.getItem('mpro_bg');
            if (savedBg) {
                if (savedBg.startsWith('http') || savedBg.startsWith('data:')) {
                    document.body.style.backgroundImage = `url('${savedBg}')`;
                } else {
                    document.body.style.backgroundColor = savedBg;
                }
            }
        }

        // Modular Apps Registry (Add/Modify items seamlessly)
        const appsList = [
            {
                name: "Microsoft 365",
                url: "https://powerpoint.cloud.microsoft/en-us/",
                isExternal: true,
                svg: `<path fill="#f39c12" d="M6 10l16-6v40L6 38z"/><path fill="#e67e22" d="M22 4l20 5v30l-20 5z"/><path fill="#ffffff" d="M12 18h6v12h-6z"/>`
            },
            {
                name: "VS Code",
                url: "https://vscode.dev/",
                isExternal: true,
                svg: `<path fill="#007acc" d="M38 4L22 18 11 10 4 15l10 9L4 33l7 5 11-8 16 14V4z"/>`
            },
            {
                name: "Browser",
                url: "https://google.com",
                isExternal: true,
                svg: `<circle cx="24" cy="24" r="20" fill="#4285f4"/><circle cx="24" cy="24" r="12" fill="#ea4335"/><circle cx="24" cy="24" r="8" fill="#fbbc05"/><circle cx="24" cy="24" r="5" fill="#ffffff"/>`
            },
            {
                name: "Game Hub",
                url: "https://www.crazygames.com/",
                isExternal: true,
                svg: `<rect x="6" y="14" width="36" height="20" rx="8" fill="#af52de"/><path fill="#ffffff" d="M14 21h3v2h2v3h-2v3h-3v-3h-2v-3h2z"/><circle cx="30" cy="22" r="2" fill="#ffffff"/><circle cx="34" cy="26" r="2" fill="#ffffff"/>`
            },
            {
                name: "Terminal",
                url: "#",
                actionMessage: "Opening Terminal container...",
                isExternal: false,
                svg: `<rect x="4" y="8" width="40" height="32" rx="6" fill="#1c1c1e"/><path fill="#32d74b" d="M12 16l8 8-8 8v-4l4-4-4-4zm10 12h12v4H22z"/>`
            }
        ];

        function renderApps() {
            const grid = document.getElementById('appsGrid');
            grid.innerHTML = "";

            appsList.forEach(app => {
                const element = document.createElement(app.isExternal ? 'a' : 'div');
                element.className = 'app-card';
                
                if (app.isExternal) {
                    element.href = app.url;
                    element.target = '_blank';
                } else {
                    element.onclick = () => alert(app.actionMessage);
                }

                element.innerHTML = `
                    <svg class="app-icon-svg" viewBox="0 0 48 48">
                        ${app.svg}
                    </svg>
                    <div class="app-name">${app.name}</div>
                `;

                grid.appendChild(element);
            });
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute("data-theme");
            const btn = document.getElementById("themeToggleBtn");
            const newTheme = currentTheme === "light" ? "dark" : "light";

            document.documentElement.setAttribute("data-theme", newTheme);
            localStorage.setItem('mpro_theme', newTheme);
            btn.innerText = newTheme === "light" ? "☀️" : "🌙";
        }

        loadSettings();
        renderApps();
    </script>
</body>
</html>
