<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MproAll | Settings</title>
    <link rel="icon" type="image/png" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚙️</text></svg>">
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-glass: rgba(255, 255, 255, 0.03);
            --card-glass: rgba(255, 255, 255, 0.04);
            --card-hover: rgba(255, 255, 255, 0.08);
            --text-main: #f5f5f7;
            --text-sub: rgba(255, 255, 255, 0.5);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent: #0a84ff;
        }

        [data-theme="light"] {
            --bg-color: #f2f2f7;
            --surface-glass: rgba(255, 255, 255, 0.7);
            --card-glass: rgba(255, 255, 255, 0.6);
            --card-hover: rgba(255, 255, 255, 0.9);
            --text-main: #1d1d1f;
            --text-sub: rgba(60, 60, 67, 0.6);
            --border-glass: rgba(0, 0, 0, 0.06);
            --accent: #007aff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: background-color 0.3s ease;
        }

        .titlebar {
            height: 38px;
            background: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            border-bottom: 1px solid var(--border-glass);
        }

        .app-logo-text {
            font-weight: 600;
            font-size: 13px;
            letter-spacing: -0.01em;
        }

        .back-btn {
            font-size: 12px;
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            backdrop-filter: blur(10px);
            transition: background 0.15s;
        }

        .back-btn:hover {
            background: var(--card-hover);
        }

        .workspace {
            flex: 1;
            padding: 36px 20px;
            max-width: 560px;
            margin: 0 auto;
            width: 100%;
            overflow-y: auto;
        }

        h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 20px;
        }

        .settings-card {
            background: var(--card-glass);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--border-glass);
            padding: 24px;
            border-radius: 18px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-sub);
            margin-bottom: 6px;
            font-weight: 500;
            letter-spacing: -0.01em;
        }

        input, select {
            width: 100%;
            padding: 10px 14px;
            background: var(--surface-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--accent);
        }

        .save-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 11px 20px;
            font-weight: 500;
            font-size: 13px;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3);
            transition: opacity 0.2s, transform 0.1s;
        }

        .save-btn:hover {
            opacity: 0.9;
        }

        .success-msg {
            margin-top: 12px;
            color: #32d74b;
            font-size: 12px;
            text-align: center;
            display: none;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="titlebar">
        <span class="app-logo-text">mproAll Settings</span>
        <a href="app.html" class="back-btn">← Back</a>
    </div>

    <div class="workspace">
        <h1>Workspace Preferences</h1>

        <div class="settings-card">
            <label>Appearance Theme</label>
            <select id="themeSelect">
                <option value="dark">Dark Liquid Glass</option>
                <option value="light">Light Liquid Glass</option>
            </select>

            <label>Welcome Heading Text</label>
            <input type="text" id="welcomeTitleInput" placeholder="Your Favorite Apps Right Where You Need Them">

            <label>Welcome Subtitle Text</label>
            <input type="text" id="welcomeSubInput" placeholder="Mpro inc">

            <label>Background Wallpaper URL or Hex Color</label>
            <input type="text" id="bgInput" placeholder="e.g. #0b0f19 or https://images.unsplash.com/...">

            <button class="save-btn" onclick="saveSettings()">Save & Apply Preferences</button>
            <div class="success-msg" id="successMsg">Preferences saved successfully! Refreshing...</div>
        </div>
    </div>

    <script>
        function initSettings() {
            const currentTheme = localStorage.getItem('mpro_theme') || 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            document.getElementById('themeSelect').value = currentTheme;
            document.getElementById('welcomeTitleInput').value = localStorage.getItem('mpro_welcome_title') || '';
            document.getElementById('welcomeSubInput').value = localStorage.getItem('mpro_welcome_sub') || '';
            document.getElementById('bgInput').value = localStorage.getItem('mpro_bg') || '';
        }

        function saveSettings() {
            const theme = document.getElementById('themeSelect').value;
            const title = document.getElementById('welcomeTitleInput').value;
            const sub = document.getElementById('welcomeSubInput').value;
            const bg = document.getElementById('bgInput').value;

            localStorage.setItem('mpro_theme', theme);
            if(title) localStorage.setItem('mpro_welcome_title', title);
            if(sub) localStorage.setItem('mpro_welcome_sub', sub);
            if(bg) localStorage.setItem('mpro_bg', bg);

            const msg = document.getElementById('successMsg');
            msg.style.display = 'block';

            setTimeout(() => {
                window.location.href = 'app.html';
            }, 800);
        }

        initSettings();
    </script>
</body>
</html>
